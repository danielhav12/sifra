<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Řecká šifra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;1,400&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6ECEF; --paper:#FBFCFD; --ink:#1B2A47; --muted:#5A6A82; --line:#C9D3DA;
  --patina:#2E7A6A; --patina-ink:#FFFFFF; --soft:#DCE6E4; --err:#A3352D;
  --serif:"Noto Serif",Georgia,"Times New Roman",serif;
  --sans:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121A28; --paper:#1A2436; --ink:#E4EAF2; --muted:#9AA8BC; --line:#2E3B52;
    --patina:#5FB8A3; --patina-ink:#0D1A17; --soft:#1F3330; --err:#E58A80;
  }
}
:root[data-theme="dark"]{
  --bg:#121A28; --paper:#1A2436; --ink:#E4EAF2; --muted:#9AA8BC; --line:#2E3B52;
  --patina:#5FB8A3; --patina-ink:#0D1A17; --soft:#1F3330; --err:#E58A80;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55}
main{max-width:760px;margin:0 auto;padding:2.5rem 1.25rem 3rem}
header{margin-bottom:2rem}
.mark{font-family:var(--serif);font-weight:400;font-size:clamp(2.6rem,10vw,4.4rem);line-height:1.05;margin:0;letter-spacing:.01em}
.sub{margin:.6rem 0 0;color:var(--muted);max-width:36rem}
label{display:block;font-weight:500;font-size:.95rem;margin-bottom:.4rem}
textarea{width:100%;min-height:9rem;resize:vertical;font:1.05rem/1.6 var(--sans);color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:.9rem 1rem}
textarea:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--patina);outline-offset:2px}
.out{margin-top:1.5rem;background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--patina);border-radius:0;padding:1.1rem 1.2rem;min-height:6rem}
.out .lbl{font-size:.85rem;color:var(--muted);margin:0 0 .5rem}
#result{font-family:var(--serif);font-size:1.45rem;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
#result.empty{font-family:var(--sans);font-size:1rem;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1rem;align-items:center}
.btn{font:500 .95rem var(--sans);border-radius:10px;padding:.65rem 1.1rem;cursor:pointer;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.btn.primary{background:var(--patina);border-color:var(--patina);color:var(--patina-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
#status{font-size:.9rem;color:var(--muted);min-height:1.4em}
#status.err{color:var(--err)}

.pdfbox{margin-top:2rem}
.sizerow{display:flex;justify-content:space-between;align-items:baseline}
.sizerow label{margin:0}
#sizeOut{font-weight:700;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--patina);margin:.6rem 0 1.2rem}
input[type=range]:focus-visible{outline:2px solid var(--patina);outline-offset:4px}
.pdfbox .lbl{font-size:.85rem;color:var(--muted);margin:0 0 .6rem}
.preview{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 14px;background:transparent}
.preview img{width:min(320px,78vw);aspect-ratio:210/297;flex:none;background:#fff;border:1px solid var(--line);box-shadow:0 2px 10px rgba(27,42,71,.12)}
.preview .ph{color:var(--muted);margin:0;padding:2rem 0}
details{margin-top:2.5rem;border-top:1px solid var(--line);padding-top:1rem}
summary{cursor:pointer;font-weight:500}
.key{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;margin-top:1rem}
.key div{background:var(--paper);border:1px solid var(--line);border-radius:8px;text-align:center;padding:.4rem 0}
.key span{display:block;font-size:.8rem;color:var(--muted)}
.key b{font-family:var(--serif);font-weight:400;font-size:1.35rem}
</style>
</head>
<body>
<main>

  <label for="input" id="inLabel">Tvůj text</label>
  <textarea id="input" placeholder="Ahoj, tohle je tajná zpráva."></textarea>

  <section class="out" aria-live="polite">
    <p class="lbl" id="outLabel">Zašifrováno</p>
    <p id="result" class="empty">Výsledek se objeví tady.</p>
  </section>

  <section class="pdfbox">
    <div class="sizerow">
      <label for="size">Velikost písma</label>
      <output id="sizeOut" for="size">18 pt</output>
    </div>
    <input type="range" id="size" min="10" max="60" step="1" value="18">
    <p class="lbl" id="pageInfo">Náhled PDF</p>
    <div id="preview" class="preview"><p class="ph">Náhled se objeví, až něco napíšeš.</p></div>
  </section>

  <div class="actions">
    <button class="btn primary" id="pdfBtn" type="button" disabled>Stáhnout PDF</button>
    <button class="btn" id="docxBtn" type="button" disabled>Stáhnout DOCX</button>
    <button class="btn" id="copyBtn" type="button" disabled>Kopírovat</button>
    <span id="status"></span>
  </div>

  <details>
    <summary>Klíč k šifře</summary>
    <div class="key" id="key"></div>
  </details>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const KEY={a:'ψ',b:'λ',c:'α',d:'ω',e:'θ',f:'κ',g:'ε',h:'ν',i:'ϝ',j:'ρ',k:'β',l:'ξ',m:'τ',n:'γ',o:'ζ',p:'η',q:'ο',r:'χ',s:'μ',t:'δ',u:'π',v:'σ',w:'ι',x:'φ',y:'ϙ',z:'υ'};

function encode(t){
  return [...t.normalize('NFD').replace(/[\u0300-\u036f]/g,'')].map(c=>{
    const l=c.toLowerCase(),g=KEY[l];
    if(!g)return c;
    return c!==l?g.toUpperCase():g;
  }).join('').normalize('NFC');
}

const $=id=>document.getElementById(id);
const input=$('input'),result=$('result'),pdfBtn=$('pdfBtn'),docxBtn=$('docxBtn'),copyBtn=$('copyBtn'),status=$('status');
const sizeIn=$('size'),sizeOut=$('sizeOut'),preview=$('preview'),pageInfo=$('pageInfo');

function setStatus(msg,err){status.textContent=msg||'';status.className=err?'err':''}

function render(){
  const v=input.value;
  if(v.trim()){result.textContent=encode(v);result.classList.remove('empty')}
  else{result.textContent='Výsledek se objeví tady.';result.classList.add('empty')}
  pdfBtn.disabled=docxBtn.disabled=copyBtn.disabled=!v.trim();
  setStatus('');
  schedulePreview();
}
input.addEventListener('input',render);
sizeIn.addEventListener('input',()=>{sizeOut.textContent=sizeIn.value+' pt';schedulePreview()});

const keyEl=$('key');
for(const k in KEY){
  const d=document.createElement('div');
  const s=document.createElement('span');s.textContent=k.toUpperCase();
  const b=document.createElement('b');b.textContent=KEY[k];
  d.append(s,b);keyEl.append(d);
}

copyBtn.onclick=async()=>{
  const text=result.textContent;
  try{await navigator.clipboard.writeText(text);setStatus('Zkopírováno.')}
  catch(e){
    const r=document.createRange();r.selectNodeContents(result);
    const sel=getSelection();sel.removeAllRanges();sel.addRange(r);
    setStatus('Text je označený, zkopíruj ho ručně.');
  }
};

let downloads;
(async()=>{
  if(window.claude&&typeof window.claude.use==='function'){
    try{downloads=await window.claude.use('downloads')}catch(e){downloads=null}
    if(downloads===null){pdfBtn.hidden=true;docxBtn.hidden=true}
  }
})();

function wrapLines(ctx,text,maxW){
  const lines=[];
  for(const para of text.split('\n')){
    if(!para){lines.push('');continue}
    let line='';
    for(const word of para.split(/(\s+)/)){
      const test=line+word;
      if(ctx.measureText(test).width<=maxW){line=test;continue}
      if(line.trim())lines.push(line.trimEnd());
      line=word.trimStart();
      while(ctx.measureText(line).width>maxW){
        let i=line.length;
        while(i>1&&ctx.measureText(line.slice(0,i)).width>maxW)i--;
        lines.push(line.slice(0,i));line=line.slice(i);
      }
    }
    lines.push(line.trimEnd());
  }
  return lines;
}

const W=1240,H=1754,M=130,PX_PER_PT=W/595.28;
const FAM='"Noto Serif", Georgia, serif';

async function renderPages(text,pt){
  const size=Math.round(pt*PX_PER_PT),lh=Math.round(size*1.5);
  try{await document.fonts.load(`${size}px ${FAM}`,text)}catch(e){}
  const c=document.createElement('canvas');c.width=W;c.height=H;
  const ctx=c.getContext('2d');ctx.font=`${size}px ${FAM}`;
  const lines=wrapLines(ctx,text,W-2*M);
  const perPage=Math.max(1,Math.floor((H-2*M)/lh));
  const pages=[];
  for(let p=0;p*perPage<lines.length;p++){
    ctx.fillStyle='#FFFFFF';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#1B2A47';ctx.font=`${size}px ${FAM}`;ctx.textBaseline='top';
    lines.slice(p*perPage,(p+1)*perPage).forEach((l,i)=>ctx.fillText(l,M,M+i*lh));
    pages.push(c.toDataURL('image/png'));
  }
  return pages;
}

let pvTimer,pvSeq=0;
function schedulePreview(){clearTimeout(pvTimer);pvTimer=setTimeout(updatePreview,180)}
async function updatePreview(){
  const seq=++pvSeq;
  if(!input.value.trim()){
    preview.innerHTML='<p class="ph">Náhled se objeví, až něco napíšeš.</p>';
    pageInfo.textContent='Náhled PDF';return;
  }
  const pages=await renderPages(encode(input.value),+sizeIn.value);
  if(seq!==pvSeq)return;
  preview.replaceChildren(...pages.map((src,i)=>{
    const img=new Image();img.src=src;img.alt='Strana '+(i+1);return img;
  }));
  const n=pages.length;
  pageInfo.textContent='Náhled PDF, '+n+(n===1?' strana':n<5?' strany':' stran');
}

async function buildPdf(text,pt){
  const pages=await renderPages(text,pt);
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:'mm',format:'a4'});
  pages.forEach((src,i)=>{if(i)doc.addPage();doc.addImage(src,'PNG',0,0,210,297)});
  return doc;
}

async function offerFile(name,buf,blobType){
  if(downloads){
    try{await downloads.save({filename:name,data:buf});setStatus('Soubor uložen.')}
    catch(e){
      if(e&&e.code==='declined')setStatus('Stažení zrušeno.');
      else if(e&&e.code==='rate_limited')setStatus('Chvilku počkej a zkus to znovu.',true);
      else setStatus('Soubor se nepodařilo uložit.',true);
    }
  }else{
    const url=URL.createObjectURL(new Blob([buf],{type:blobType}));
    const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);setStatus('Soubor stažen.');
  }
}

pdfBtn.onclick=async()=>{
  if(!input.value.trim())return;
  if(!window.jspdf){setStatus('PDF knihovna se nenačetla. Zkus stránku obnovit.',true);return}
  pdfBtn.disabled=true;setStatus('Připravuju PDF…');
  try{
    const doc=await buildPdf(encode(input.value),+sizeIn.value);
    await offerFile('recka-sifra.pdf',doc.output('arraybuffer'),'application/pdf');
  }catch(e){setStatus('PDF se nepodařilo vytvořit.',true)}
  finally{pdfBtn.disabled=!input.value.trim()}
};

const esc=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
async function buildDocx(text,pt){
  const sz=Math.round(pt*2),font='Cambria';
  const rpr=`<w:rPr><w:rFonts w:ascii="${font}" w:hAnsi="${font}" w:cs="${font}"/><w:sz w:val="${sz}"/><w:szCs w:val="${sz}"/></w:rPr>`;
  const paras=text.split('\n').map(l=>l
    ? `<w:p><w:pPr><w:spacing w:after="0" w:line="360" w:lineRule="auto"/></w:pPr><w:r>${rpr}<w:t xml:space="preserve">${esc(l)}</w:t></w:r></w:p>`
    : `<w:p><w:pPr><w:spacing w:after="0"/></w:pPr></w:p>`).join('');
  const zip=new JSZip();
  zip.file('[Content_Types].xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>');
  zip.file('_rels/.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');
  zip.file('word/document.xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${paras}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1418" w:right="1418" w:bottom="1418" w:left="1418" w:header="708" w:footer="708" w:gutter="0"/></w:sectPr></w:body></w:document>`);
  return zip.generateAsync({type:'arraybuffer'});
}

docxBtn.onclick=async()=>{
  if(!input.value.trim())return;
  if(!window.JSZip){setStatus('Knihovna pro DOCX se nenačetla. Zkus stránku obnovit.',true);return}
  docxBtn.disabled=true;setStatus('Připravuju DOCX…');
  try{
    const buf=await buildDocx(encode(input.value),+sizeIn.value);
    await offerFile('recka-sifra.docx',buf,'application/vnd.openxmlformats-officedocument.wordprocessingml.document');
  }catch(e){setStatus('DOCX se nepodařilo vytvořit.',true)}
  finally{docxBtn.disabled=!input.value.trim()}
};

render();
</script>
</body>
</html>
